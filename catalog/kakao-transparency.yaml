api_language: ko
notes: |
  Platform transparency-report blueprint: a single unauthenticated JSON
  endpoint behind the public Kakao Privacy site, discovered by reading the
  page's own loader (`/js/renew/sub/transparency.js` calls
  `$.get("/api/transparency/" + year + "/" + halfYearId, …)`).

  Surface: `GET /api/transparency/{year}/{halfYearId}` (halfYearId 1 = 1H,
  2 = 2H) returns one half-year of statistics — 8 rows (Kakao and Daum, each
  across 4 government request categories: communication user information,
  communication-restricting measures, communication confirmation data, and
  search & seizure warrants), a narrative summary, XLSX download links
  (Korean + English editions on t1.kakaocdn.net), and `prevYn`/`nextYn`
  flags for walking the archive. Coverage: 1H 2012 through the latest
  published half-year.

  Localization: the `Accept-Language` header (`ko`/`en`) switches the
  localized fields; `en*` twin fields (`enTitle`, `enContent`, `enCategory`,
  `enFileUrl`) always carry English.

  Quirks a printed CLI must handle:
    - Out-of-range year/half-year returns the site's HTML error page with
      HTTP 200, not a JSON error — treat a non-JSON body as "no report
      published" and use prevYn/nextYn to paginate safely.
    - All counts are strings; "-1" renders as "N/A" on the site.
    - `serviceCorp` is always Korean ("카카오"/"다음") regardless of language.

  Works with plain net/http (verified with curl, no browser headers needed).
  Companion entry: naver-privacy (Naver publishes the equivalent statistics
  through its Privacy Center CMS API).
