name: kakao-transparency
display_name: Kakao Transparency
description: Kakao's semiannual transparency-report statistics — South Korean government requests for user data (warrants, communication data, restriction measures) for Kakao and Daum services since 2012.
category: other
spec_url: https://raw.githubusercontent.com/krMaynard/transparency-api-cli/main/catalog/specs/kakao-transparency.yaml
spec_format: yaml
